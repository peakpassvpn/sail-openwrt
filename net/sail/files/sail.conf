# sail's own configuration is the file `config` names: a sing-box JSON,
# Clash YAML or Surge profile, taken as it is.
config sail 'main'
	option enabled '0'
	option config '/etc/sail/config.json'
	# router (the least memory), mobile, desktop or server.
	option profile 'router'
	# /var is in RAM: subscriptions and rule-sets are fetched again after
	# a reboot. A directory on flash keeps them, at the cost of writes.
	option cache_dir '/var/lib/sail'
	# The kernel caps a TCP connection's receive buffer at about 1/128 of
	# free memory: at 100 ms to the server, one upstream connection then
	# carries about 13 Mbit/s on a 128 MB router, 35 on a 256 MB one and
	# 70 on a 512 MB one. '1' (the default) raises this system-wide cap
	# to 6 MiB, never lowering it, through /etc/sysctl.d/90-sail-tcp.conf:
	# about 110 Mbit/s each. Only fast connections grow to it. '0' leaves
	# the kernel's cap, which returns at a reboot.
	option tcp_buffers '1'
