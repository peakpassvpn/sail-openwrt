# sail's own configuration is the file `config` names: a sing-box JSON,
# Clash YAML or Surge profile, taken as it is.
config sail 'main'
	option enabled '0'
	option config '/etc/sail/config.json'
	# router (the least memory), mobile, desktop or server.
	option profile 'router'
	# /var is in RAM: subscriptions and rule-sets are fetched again after
	# a reboot. A directory on flash keeps them, at the cost of writes.
	option cache_dir '/var/lib/sail'
